plugins {
    id 'com.android.application'
}

android {
    namespace 'com.browndli.wanderchina'
    compileSdk 34

    defaultConfig {
        applicationId 'com.browndli.wanderchina'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    // 签名：仓库里设置了 ANDROID_KEYSTORE_BASE64 和 ANDROID_KEYSTORE_PASSWORD 两个密钥时用固定签名，
    // 没有设置时由 GitHub Actions 临时生成。密钥文件不保存在仓库里。
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.keystore')
            storeType 'pkcs12'
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: 'wanderchina'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}
