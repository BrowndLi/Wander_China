<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>游迹中国 Wander China</title>
<meta name="description" content="按城市浏览中国热门景点，按热度、著名度、好玩度排序，热度定时自动更新。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151D1A" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="游迹中国">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 游迹中国 · 样式
 * 配色：玉青（主色）· 朱橙（热度）· 金（著名度）· 玫红（好玩度），中性色带一点青绿偏色。
 * 字体：只用系统中文字体（Google Fonts 在国内经常无法访问，会拖慢首屏）。
 */
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface-2:#E8EEEB;--surface-3:#D8E2DD;
  --text:#17211E;--text-2:#3B4844;--muted:#62716B;--line:#D3DDD8;--line-2:#B9C7C1;
  --primary:#1E6C60;--primary-2:#15564C;--primary-ink:#FFFFFF;--primary-soft:#DBEDE7;--primary-soft-2:#C3E1D7;
  --hot:#DD5226;--hot-ink:#B63C14;--hot-soft:#FBE5DC;
  --fame:#CC9B1E;--fame-ink:#8A6604;--fame-soft:#F7EDCF;
  --fun:#D04A86;--fun-ink:#A93068;--fun-soft:#F9E0EB;
  --all:#1E6C60;--all-ink:#15564C;
  --gold:#D8AA2E;--silver:#A3AFAA;--bronze:#BE7F4E;
  --ok:#2D8A57;--warn:#B86E00;--danger:#BE3A2C;--danger-soft:#F8E0DC;
  --lvl1:#3E9E74;--lvl2:#C9A227;--lvl3:#E07B2E;--lvl4:#D2402A;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 12px 30px -16px rgba(20,40,35,.25);
  --radius:14px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Noto Serif SC","Source Han Serif SC","Songti SC","STZhongsong","STSong","SimSun",serif;
  --font-num:"Bahnschrift","DIN Alternate","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --topbar-h:60px;--nav-h:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412;--surface:#151D1A;--surface-2:#1C2623;--surface-3:#28342F;
    --text:#E3EBE7;--text-2:#B6C3BD;--muted:#8A9993;--line:#27322E;--line-2:#3A4944;
    --primary:#50B7A1;--primary-2:#7ED0BE;--primary-ink:#0A1512;--primary-soft:#16302A;--primary-soft-2:#1D4037;
    --hot:#EE6840;--hot-ink:#FF8C68;--hot-soft:#3A1F16;
    --fame:#D6AB38;--fame-ink:#E9C45C;--fame-soft:#372D12;
    --fun:#E06A9F;--fun-ink:#F291BB;--fun-soft:#381A29;
    --all:#50B7A1;--all-ink:#7ED0BE;
    --gold:#DDB23E;--silver:#A7B4AF;--bronze:#C98C5C;
    --ok:#4BC27E;--warn:#E3A13B;--danger:#E6634F;--danger-soft:#3C1E19;
    --lvl1:#4FB287;--lvl2:#D2AE3A;--lvl3:#E88A44;--lvl4:#E45A45;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1C2623;--surface-3:#28342F;
  --text:#E3EBE7;--text-2:#B6C3BD;--muted:#8A9993;--line:#27322E;--line-2:#3A4944;
  --primary:#50B7A1;--primary-2:#7ED0BE;--primary-ink:#0A1512;--primary-soft:#16302A;--primary-soft-2:#1D4037;
  --hot:#EE6840;--hot-ink:#FF8C68;--hot-soft:#3A1F16;
  --fame:#D6AB38;--fame-ink:#E9C45C;--fame-soft:#372D12;
  --fun:#E06A9F;--fun-ink:#F291BB;--fun-soft:#381A29;
  --all:#50B7A1;--all-ink:#7ED0BE;
  --gold:#DDB23E;--silver:#A7B4AF;--bronze:#C98C5C;
  --ok:#4BC27E;--warn:#E3A13B;--danger:#E6634F;--danger-soft:#3C1E19;
  --lvl1:#4FB287;--lvl2:#D2AE3A;--lvl3:#E88A44;--lvl4:#E45A45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:var(--nav-h)}
a{color:var(--primary-2)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{text-wrap:balance}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:var(--topbar-h)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text);text-decoration:none;white-space:nowrap;letter-spacing:.04em}
.brand svg{width:28px;height:28px;flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-text .zh{font-size:20px}
.brand-text .en{font-family:var(--font-num);font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
.nav a .ic{display:none}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary-2);font-weight:600}
.search{position:relative;flex:1;max-width:340px;margin-left:auto}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--text);font:inherit;font-size:14px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{background:var(--surface);border-color:var(--primary);outline:none}
.search>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:70;max-height:min(70vh,460px);overflow-y:auto;padding:4px}
.search-results button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:14px}
.search-results button:hover,.search-results button.active{background:var(--surface-2)}
.search-results .kind{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--primary-soft);color:var(--primary-2);flex:none}
.search-results .kind.city{background:var(--hot-soft);color:var(--hot-ink)}
.search-results .where{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.search-results .none{padding:12px;color:var(--muted);font-size:13.5px}
.search-results mark{background:transparent;color:var(--hot-ink);font-weight:700}
.hotpill{display:inline-flex;align-items:center;gap:7px;padding:0 12px;height:36px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap;flex:none}
.hotpill:hover{border-color:var(--line-2)}
.hotpill .dot{width:8px;height:8px;border-radius:50%;background:var(--hot);animation:pulse 2.4s infinite;flex:none}
.hotpill.busy .dot{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hot) 50%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.netstate{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--fame-soft);color:var(--fame-ink);font-size:12px;font-weight:600;flex:none;white-space:nowrap}
.installbar{display:flex;align-items:center;gap:12px;background:var(--primary-soft);border:1px solid var(--primary-soft-2);border-radius:var(--radius);padding:12px 14px;margin-top:18px}
.installbar>.ic{width:22px;height:22px;color:var(--primary-2)}
.installbar .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.installbar .t b{font-size:14.5px}
.installbar .t span{font-size:13px;color:var(--text-2)}
.installbar .acts{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.chip.here{background:var(--hot-soft);border-color:transparent;color:var(--hot-ink);font-weight:600}
.chip.locate .ic{width:14px;height:14px}
.chip[disabled]{opacity:.6;cursor:default}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;color:var(--text-2);padding:0;flex:none}
.iconbtn:hover{border-color:var(--line-2);color:var(--text)}
.iconbtn .ic{width:18px;height:18px}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:13.5px;font-weight:500;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn .ic{width:15px;height:15px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.want.on{background:var(--fun-soft);border-color:transparent;color:var(--fun-ink)}
.btn.want.on .ic{fill:currentColor}
.btn.been.on{background:var(--primary-soft);border-color:transparent;color:var(--primary-2)}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;flex:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg button .ic{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.seg button[data-sort="heat"][aria-pressed="true"] .ic{color:var(--hot)}
.seg button[data-sort="fame"][aria-pressed="true"] .ic{color:var(--fame)}
.seg button[data-sort="fun"][aria-pressed="true"] .ic{color:var(--fun)}
.seg button[data-sort="all"][aria-pressed="true"] .ic{color:var(--all)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex:none}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip .c{font-family:var(--font-num);font-size:11px;opacity:.75}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.cat{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary-2);white-space:nowrap;font-weight:500;font-family:var(--font)}
.whys{display:flex;flex-wrap:wrap;gap:5px}
.why{font-size:11.5px;padding:2px 7px;border-radius:6px;white-space:nowrap;background:var(--surface-2);color:var(--text-2);font-weight:500}
.why.season{background:var(--primary-soft);color:var(--primary-2)}
.why.peak,.why.up,.why.holiday{background:var(--hot-soft);color:var(--hot-ink)}
.why.off{background:var(--surface-3);color:var(--muted)}
.why.classic{background:var(--fame-soft);color:var(--fame-ink)}
.why.fun{background:var(--fun-soft);color:var(--fun-ink)}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--surface-2);color:var(--text-2);font-family:var(--font-num);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.rank.r1{background:var(--gold);color:#2B2205}
.rank.r2{background:var(--silver);color:#1C2320}
.rank.r3{background:var(--bronze);color:#FFFFFF}
.delta{font-family:var(--font-num);font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.up{color:var(--hot-ink)}
.delta.down{color:var(--primary-2)}
.delta.flat{color:var(--muted)}
.flash-up{animation:flashUp 1.2s ease-out}
.flash-down{animation:flashDown 1.2s ease-out}
@keyframes flashUp{0%{background:color-mix(in srgb,var(--hot) 28%,transparent)}100%{background:transparent}}
@keyframes flashDown{0%{background:color-mix(in srgb,var(--primary) 26%,transparent)}100%{background:transparent}}
.spark{display:block;max-width:100%;height:auto;overflow:visible}
.spark .line{fill:none;stroke:var(--hot);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--hot);opacity:.13}
.spark .dot{fill:var(--hot)}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scores.four{grid-template-columns:repeat(4,1fr)}
.score{display:flex;flex-direction:column;gap:5px;min-width:0}
.score .lab{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.score .lab .ic{color:var(--c);width:14px;height:14px}
.score .val{display:flex;align-items:baseline;gap:6px;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;line-height:1;color:var(--ci)}
.score .val .delta{font-size:11.5px}
.score .bar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.score .bar i{display:block;height:100%;border-radius:2px;background:var(--c);transition:width .5s}
.score.hot{--c:var(--hot);--ci:var(--hot-ink)}
.score.fame{--c:var(--fame);--ci:var(--fame-ink)}
.score.fun{--c:var(--fun);--ci:var(--fun-ink)}
.score.all{--c:var(--all);--ci:var(--all-ink)}
.score.big .val{font-size:28px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:340px}
.months i{font-style:normal;text-align:center;font-size:11px;line-height:22px;border-radius:5px;background:var(--surface-3);color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.months i.on{background:var(--primary-soft-2);color:var(--primary-2);font-weight:700}
.months i.peak{background:var(--hot-soft);color:var(--hot-ink);font-weight:700}
.months i.off{background:transparent;color:var(--line-2);text-decoration:line-through}
.months i.now{box-shadow:inset 0 0 0 1.5px var(--text)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius);background:var(--surface)}
.notice{padding:10px 14px;border-radius:10px;background:var(--fame-soft);color:var(--text-2);font-size:13.5px;margin-block:12px}
.notice.error{background:var(--danger-soft)}
.sec{margin-block:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:7px}
.sec-h h2 .ic{width:18px;height:18px}
.sec-h .hint{font-size:12.5px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--primary-2);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;align-items:start}
.kv>b{font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.kv>b .ic{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card>h2{margin:0 0 10px;font-size:17px}
.card h3{margin:16px 0 6px;font-size:14.5px}
.card p{margin:0 0 8px;color:var(--text-2);font-size:14px}
.card ul,.card ol{margin:0 0 8px;padding-left:20px;color:var(--text-2);font-size:14px}
.card li{margin-bottom:3px}
.card code{font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Consolas,monospace}
.card pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;font-size:12px;overflow-x:auto;margin:6px 0 10px;font-family:ui-monospace,Consolas,monospace;line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>label{font-size:13px;color:var(--text-2);font-weight:500}
.field input[type="text"],.field input[type="url"],.field select,.field textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);outline:none}
.field .help{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea.json{width:100%;min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--text);resize:vertical}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th,table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tbl th{color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap}
table.tbl td.num{white-space:nowrap}

/* ---------- 首页 ---------- */
.hero{padding-block:32px 6px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:stretch}
.hero-copy{display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero .eyebrow{font-size:12.5px;color:var(--primary-2);font-weight:600;letter-spacing:.12em;margin-bottom:8px}
.hero h1{font-family:var(--font-display);font-size:clamp(28px,4vw,42px);line-height:1.25;margin:0 0 12px;font-weight:700;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--hot-ink)}
.hero p{color:var(--text-2);margin:0 0 18px;max-width:56ch}
.hero .search{max-width:520px;margin:0}
.hero .search input{height:46px;font-size:15px;background:var(--surface);padding-left:42px}
.hero .search>.ic{left:15px}
.hero .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;font-size:12.5px;color:var(--muted)}
.livebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.livebox .t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.livebox .t b{color:var(--text);font-weight:600;display:flex;align-items:center;gap:6px}
.livebox .t b .ic{color:var(--hot)}
.livebox .bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.livebox .big{font-family:var(--font-num);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--hot-ink)}
.livebox .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px;font-family:var(--font)}
.livebox .tip{font-size:13px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.livebox .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.factors{display:flex;flex-wrap:wrap;gap:6px}
.factor{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.factor.up{background:var(--hot-soft);color:var(--hot-ink)}
.factor.down{background:var(--primary-soft);color:var(--primary-2)}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:0 22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 14px}
.brow{display:grid;grid-template-columns:30px minmax(0,1fr) 84px 56px 54px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;min-width:0}
.brow:nth-child(5n){border-bottom:0}
.brow:hover{background:var(--surface-2)}
.brow .nm{min-width:0;display:flex;align-items:baseline;gap:8px}
.brow .nm b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .nm span{font-size:12px;color:var(--muted);white-space:nowrap}
.brow .n{font-family:var(--font-num);font-size:19px;font-weight:700;color:var(--hot-ink);text-align:right;font-variant-numeric:tabular-nums;border-radius:4px;padding-inline:2px}
.brow .delta{text-align:right}
.top3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.top3 .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px;min-width:0}
.top3 .col h3{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:6px}
.top3 .col h3 .ic{width:16px;height:16px}
.top3 .col h3 small{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
.top3 ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.top3 li button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 4px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px}
.top3 li button:hover{background:var(--surface-2)}
.top3 li .nm{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top3 li .city{color:var(--muted);font-size:12px;white-space:nowrap}
.top3 li .n{font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right;border-radius:4px}
.top3 .col.hot h3 .ic,.top3 .col.hot .n{color:var(--hot-ink)}
.top3 .col.fame h3 .ic,.top3 .col.fame .n{color:var(--fame-ink)}
.top3 .col.fun h3 .ic,.top3 .col.fun .n{color:var(--fun-ink)}
.top3 .col.rise h3 .ic,.top3 .col.rise .n{color:var(--hot-ink)}
.regiontabs{display:flex;gap:6px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.dcard{position:relative;overflow:hidden;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--text);text-decoration:none;transition:transform .15s,box-shadow .15s;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.band{--h:160;color:#FFFFFF;background:linear-gradient(125deg,hsl(var(--h) 46% 34%),hsl(calc(var(--h) + 32) 52% 50%));position:relative;overflow:hidden}
.band::before{content:"";position:absolute;right:-8%;bottom:-2px;width:70%;height:62%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.04));clip-path:polygon(0 100%,22% 38%,38% 66%,58% 12%,80% 58%,100% 30%,100% 100%);pointer-events:none}
.band::after{content:"";position:absolute;inset:0;background:radial-gradient(160px 80px at 88% 12%,rgba(255,255,255,.24),transparent 70%);pointer-events:none}
.band>*{position:relative;z-index:1}
.dcard .band{height:84px;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end}
.dcard .band h3{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.22);letter-spacing:.04em}
.dcard .band .prov{font-size:12px;opacity:.92}
.dcard .band .rk{position:absolute;top:10px;right:12px;font-family:var(--font-num);font-size:12px;background:rgba(0,0,0,.22);padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.dcard .body{padding:12px 14px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
.dcard .tagline{font-size:13.5px;color:var(--text-2);margin:0}
.dcard .meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--muted)}
.dcard .hotline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:auto}
.dcard .hotline .n{font-family:var(--font-num);font-weight:700;color:var(--hot-ink);font-size:15px;font-variant-numeric:tabular-nums;border-radius:4px;padding-inline:2px}
.dcard .hotline .bar{flex:1;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.dcard .hotline .bar i{display:block;height:100%;background:var(--hot);border-radius:2px;transition:width .5s}

/* ---------- 城市页 ---------- */
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:13.5px;margin-block:16px 10px}
.backlink:hover{color:var(--text)}
.cityhead{border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.cityhead .band{padding:26px 26px 22px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end}
.cityhead h1{font-family:var(--font-display);font-size:clamp(32px,4.6vw,46px);margin:0;line-height:1.1;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.18);letter-spacing:.05em}
.cityhead .sub{font-size:14px;opacity:.94;margin-top:6px}
.cityhead .hotbig{margin-left:auto;display:flex;align-items:flex-end;gap:14px}
.cityhead .hotbig .l{font-size:12px;opacity:.92;display:flex;align-items:center;gap:5px}
.cityhead .hotbig .n{font-family:var(--font-num);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;border-radius:6px}
.cityhead .hotbig .delta{color:#FFFFFF;font-size:13px}
.cityhead .hotbig .spark .line{stroke:#FFFFFF}
.cityhead .hotbig .spark .area{fill:#FFFFFF;opacity:.22}
.cityhead .hotbig .spark .dot{fill:#FFFFFF}
.cityhead .hotbig .rk{font-size:12.5px;opacity:.95;margin-top:4px}
.cityhead .body{padding:18px 26px 20px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px 30px}
.cityhead .intro{margin:0 0 12px;color:var(--text-2);font-size:14.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:13.5px}
.fact b{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:1px}
.fact b .ic{width:13px;height:13px}
.fact.wide{grid-column:1/-1}
.fc{display:flex;flex-direction:column;gap:6px;min-width:0}
.fc h4{margin:0;font-size:13px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.fcbars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;height:100px}
.fcbars .d{display:flex;flex-direction:column;gap:4px;height:100%;min-width:0;cursor:default}
.fcbars .d .b{flex:1;position:relative;border-radius:4px;background:var(--surface-2)}
.fcbars .d .b i{position:absolute;left:0;right:0;bottom:0;border-radius:4px 4px 2px 2px;background:var(--lvl1)}
.fcbars .d.l2 .b i{background:var(--lvl2)}
.fcbars .d.l3 .b i{background:var(--lvl3)}
.fcbars .d.l4 .b i{background:var(--lvl4)}
.fcbars .d span{font-size:10px;text-align:center;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden}
.fcbars .d.hol span{color:var(--hot-ink);font-weight:700}
.fcbars .d.today span{color:var(--text);font-weight:700}
.dlg .fcbars .d .b{background:var(--surface-2)}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pick{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-width:0}
.pick:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pick .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.pick .lab .ic{width:14px;height:14px;color:var(--c)}
.pick b{font-size:15.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .n{font-family:var(--font-num);font-weight:700;font-size:18px;color:var(--ci);font-variant-numeric:tabular-nums;line-height:1.1}
.pick.hot{--c:var(--hot);--ci:var(--hot-ink)}
.pick.fame{--c:var(--fame);--ci:var(--fame-ink)}
.pick.fun{--c:var(--fun);--ci:var(--fun-ink)}
.pick.all{--c:var(--all);--ci:var(--all-ink)}
.chipsep{flex:none;width:1px;align-self:stretch;background:var(--line-2);margin-inline:4px}
.citylinks{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 26px 16px;border-top:1px solid var(--line);font-size:13px}
.links a span.muted,.links button span.muted{font-size:11.5px}
.acard .ov{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:4px}
.acard .ov b{color:var(--all-ink);font-size:16px}
.agrid>.empty{grid-column:1/-1}
.fclegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.fclegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.toolbar{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.toolbar .row{display:flex;align-items:center;gap:10px;min-width:0}
.toolbar .row.wrapit{flex-wrap:wrap}
.toolbar .count{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.toolbar .lbl{font-size:12.5px;color:var(--muted);white-space:nowrap;flex:none}
.weights{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}
.weights label{display:flex;align-items:center;gap:8px;color:var(--text-2);white-space:nowrap}
.weights input[type="range"]{width:110px;accent-color:var(--primary)}
.weights .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;min-width:30px;color:var(--text)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:11px;min-width:0}
.acard:hover{border-color:var(--line-2)}
.acard .head{display:flex;align-items:flex-start;gap:10px}
.acard .head .t{min-width:0;flex:1}
.acard h3{margin:0;font-size:17px;font-weight:700;line-height:1.35}
.acard h3 button{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:inherit;text-align:left}
.acard h3 button:hover{color:var(--primary-2);text-decoration:underline;text-underline-offset:3px}
.acard .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:3px;align-items:center}
.acard .desc{margin:0;color:var(--text-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acard .foot{display:flex;align-items:center;gap:6px;margin-top:auto;flex-wrap:wrap;padding-top:2px}
.acard .foot .spacer{flex:1}
.acard .foot .maplink{font-size:12.5px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:3px;padding:4px 6px;border-radius:6px}
.acard .foot .maplink:hover{color:var(--primary-2);background:var(--surface-2)}
.acard .foot .maplink .ic{width:14px;height:14px}
.eatline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- 榜单页 ---------- */
.pagehead{margin-block:22px 14px;display:flex;flex-direction:column;gap:6px}
.pagehead h1{margin:0;font-family:var(--font-display);font-size:clamp(24px,3.2vw,32px);letter-spacing:.03em}
.pagehead p{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{color:var(--text);text-decoration:none;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;text-align:left;width:100%}
.ritem:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.ritem .t{min-width:0}
.ritem .t b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .t span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .mini{display:flex;gap:10px;font-size:12px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.ritem .mini span b{font-weight:600}
.ritem .mini .h b{color:var(--hot-ink)}
.ritem .mini .f b{color:var(--fame-ink)}
.ritem .mini .u b{color:var(--fun-ink)}
.ritem .v{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:64px}
.ritem .v .n{font-family:var(--font-num);font-weight:700;font-size:21px;line-height:1;font-variant-numeric:tabular-nums;border-radius:4px;padding-inline:2px}
.ritem.hot .v .n{color:var(--hot-ink)}
.ritem.fame .v .n{color:var(--fame-ink)}
.ritem.fun .v .n{color:var(--fun-ink)}
.ritem.all .v .n{color:var(--all-ink)}
.ritem.city{grid-template-columns:34px minmax(0,1fr) 120px auto}
.morebar{display:flex;justify-content:center;margin-top:12px}

/* ---------- 收藏 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.stat .n{font-family:var(--font-num);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.favcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.favgroup{margin-bottom:14px}
.favgroup h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.favgroup h3 .cnt{font-size:12px;color:var(--muted);font-weight:400}
.favitem{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;min-width:0}
.favitem .t{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.favitem .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.favitem .t span{font-size:12.5px;color:var(--muted)}
.favitem .acts{display:flex;gap:6px;flex:none}
.favitem .n{font-family:var(--font-num);font-weight:700;color:var(--hot-ink);font-variant-numeric:tabular-nums;border-radius:4px;padding-inline:2px}

/* ---------- 说明页 ---------- */
.about{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.about .stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin-block:8px 12px}
.formula span{padding:4px 9px;border-radius:7px;background:var(--surface-2);white-space:nowrap}
.formula span.op{background:transparent;padding:0;color:var(--muted)}
.formula span.res{background:var(--hot-soft);color:var(--hot-ink);font-weight:600}
.platforms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.platform{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;min-width:0}
.platform b{display:block;font-size:13.5px}
.platform span{color:var(--muted);font-size:12.5px}
.status{font-size:12.5px;color:var(--muted)}
.status.ok{color:var(--ok)}
.status.err{color:var(--danger)}
.evlist{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;font-size:13px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.ev .dt{font-family:var(--font-num);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .pts{font-family:var(--font-num);color:var(--hot-ink);font-weight:600;white-space:nowrap}
.ev.now .dt{color:var(--hot-ink);font-weight:700}

/* ---------- 弹窗 ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(780px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--text);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);margin:auto}
dialog::backdrop{background:rgba(8,16,14,.55)}
.dlg{position:relative;max-height:calc(100vh - 24px);overflow:auto;padding:22px 24px 24px;overscroll-behavior:contain}
.dlg-close{position:sticky;top:0;float:right;margin:-8px -10px 0 8px;z-index:3;background:var(--surface)}
.dlg .head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.dlg .crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dlg .crumb a{color:var(--muted)}
.dlg .head h2{margin:0;font-size:26px;font-family:var(--font-display);display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:.02em}
.dlg .head .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.dlg .grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.dlg .panel{background:var(--surface-2);border-radius:12px;padding:14px 16px;min-width:0}
.dlg .panel h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dlg p.desc{font-size:14.5px;color:var(--text);margin:0 0 12px}
.dlg .tipbox{background:var(--fame-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--text-2);display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.dlg .tipbox .ic{color:var(--fame-ink);margin-top:2px}
.dlg .blk{margin-bottom:16px}
.dlg .blk>h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 4}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--font-num)}
.chart .line{fill:none;stroke:var(--hot);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--hot);opacity:.12}
.chart .dot{fill:var(--hot);stroke:var(--surface);stroke-width:2}
.chart .endlab{fill:var(--hot-ink);font-size:11px;font-weight:700;font-family:var(--font-num)}
.chart .hol{fill:var(--hot);opacity:.07}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--text);font-size:13px;background:var(--surface);cursor:pointer}
.links a:hover,.links button:hover{border-color:var(--primary);color:var(--primary-2)}
.links .ic{width:14px;height:14px;color:var(--muted)}
.links .pf{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#FFFFFF;flex:none}
.nearby{display:flex;flex-wrap:wrap;gap:6px}
.nearby button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.nearby button:hover{border-color:var(--primary);color:var(--primary-2)}
.nearby button .n{font-family:var(--font-num);color:var(--hot-ink);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- 提示条 ---------- */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--nav-h) + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;transition:opacity .25s,transform .25s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%)}
footer{margin-top:44px;padding-block:22px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}

/* ---------- 响应式 ---------- */
@media (max-width:980px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .top3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .about{grid-template-columns:minmax(0,1fr)}
  .cityhead .body{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row}
  .brow:nth-child(5n){border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:0}
}
@media (max-width:760px){
  :root{--nav-h:62px;--topbar-h:56px}
  .wrap{padding-inline:16px}
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}
  .topbar .wrap{gap:8px}
  .brand span{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:60;gap:0}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:4px 0;border-radius:10px}
  .nav a .ic{display:block;width:20px;height:20px}
  .nav a[aria-current="page"]{background:transparent}
  .search{max-width:none}
  .search-results{position:fixed;left:12px;right:12px;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px) + 4px);min-width:0}
  .hero .search-results{position:absolute;left:0;right:0;top:calc(100% + 6px)}
  .toolbar{position:static}
  .picks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .citylinks{padding:12px 18px 14px}
  .fcbars .d:nth-child(even):not(.hol) span{visibility:hidden}
  .hotpill .txt{display:none}
  .installbar{flex-wrap:wrap}
  .installbar .acts{width:100%}
  .hotpill{padding:0 11px}
  .top3{grid-template-columns:minmax(0,1fr)}
  .agrid{grid-template-columns:minmax(0,1fr)}
  .acard .desc{-webkit-line-clamp:4}
  .cityhead .band{padding:20px 18px 18px}
  .cityhead .body{padding:16px 18px}
  .cityhead .hotbig{margin-left:0}
  .facts{grid-template-columns:minmax(0,1fr)}
  .brow{grid-template-columns:28px minmax(0,1fr) 52px 48px}
  .brow .spark{display:none}
  .ritem{grid-template-columns:30px minmax(0,1fr) auto;padding:9px 12px}
  .ritem .mini{display:none}
  .ritem.city{grid-template-columns:30px minmax(0,1fr) auto}
  .ritem.city .spark{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .favcols{grid-template-columns:minmax(0,1fr)}
  .platforms{grid-template-columns:minmax(0,1fr)}
  .dlg{padding:18px 16px 20px}
  .dlg .grid2{grid-template-columns:minmax(0,1fr)}
  .scores.four{grid-template-columns:repeat(2,1fr)}
  .ev{grid-template-columns:78px minmax(0,1fr) auto}
}
@media (max-width:420px){
  .dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .dcard .band{height:74px;padding:10px 12px}
  .dcard .band h3{font-size:19px}
  .dcard .body{padding:10px 12px 11px}
  .dcard .tagline{font-size:12.5px}
  .dcard .meta{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* 游迹中国 · 数据核心定义
 * 所有目的地数据文件（data/*.js）都通过 TRAVEL_DATA.addDestinations([...]) 注册。
 * 字段说明见 README.md「数据格式」一节。
 */
window.TRAVEL_DATA = {
  version: 1,

  // 景点类别
  categories: {
    history:  { label: '历史古迹', icon: '🏯' },
    nature:   { label: '自然风光', icon: '🏞️' },
    museum:   { label: '博物馆',   icon: '🏛️' },
    park:     { label: '公园园林', icon: '🌳' },
    street:   { label: '街区古镇', icon: '🏘️' },
    modern:   { label: '现代地标', icon: '🌆' },
    religion: { label: '寺庙宗教', icon: '⛩️' },
    theme:    { label: '主题乐园', icon: '🎢' },
    night:    { label: '夜景夜游', icon: '🌃' },
    food:     { label: '美食街市', icon: '🍜' },
    show:     { label: '演出体验', icon: '🎭' }
  },

  // 景点标记
  flags: {
    free:    { label: '免费',     icon: '🆓' },
    family:  { label: '适合亲子', icon: '👨‍👩‍👧' },
    rain:    { label: '雨天可玩', icon: '☔' },
    night:   { label: '夜游佳',   icon: '🌙' },
    viral:   { label: '网红打卡', icon: '📸' },
    reserve: { label: '需预约',   icon: '📅' },
    hike:    { label: '需体力',   icon: '🥾' }
  },

  // 区域顺序
  regions: ['华北', '东北', '华东', '华中', '华南', '港澳', '西南', '西北'],

  destinations: [],

  addDestinations(list) {
    for (const d of list) {
      if (!d || !d.id) continue;
      if (this.destinations.some(x => x.id === d.id)) {
        console.warn('重复的目的地 id：' + d.id);
        continue;
      }
      d.attractions = (d.attractions || []).map(a => Object.assign({ flags: [], tags: [], bestMonths: [] }, a, { city: d.id }));
      this.destinations.push(d);
    }
  }
};

</script>

  return a.base + seasonPts(a, b) + ctx.pts + catPts(a, ctx) + intradayPts(a, b) + eventPts(a, b).p + noisePts(a, t) + bumpPts(a, t);

const spotHeat = (a, t) => soft(spotRaw(a, t));

  const sLabel = a.off.includes(m) ? `${m}月淡季` : a.peak.includes(m) ? `${m}月最佳观赏期` : (a.bestMonths.includes(m) && a.bestMonths.length < 12) ? `${m}月当季` : `${m}月季节`;
  parts.push([sLabel, seasonPts(a, b)]);
  parts.push([ctx.label, ctx.basePts]);
  if (ctx.prePts) parts.push([`${ctx.pre.h.name}前夕升温`, ctx.prePts]);
  const cp = catPts(a, ctx);
  if (Math.abs(cp) >= 0.05) parts.push([ctx.vac ? `${ctx.vac.name}加成` : '黄金周类别加成', cp]);
  parts.push([`${pad(b.h)}:${pad(b.mi)} 时段`, intradayPts(a, b)]);
  for (const ev of eventPts(a, b).list) parts.push([ev.name, ev.boost]);
  const bp = bumpPts(a, t);
  if (bp >= 0.1) parts.push(['阶段话题（模拟）', bp]);
  parts.push(['短时波动（模拟）', noisePts(a, t)]);
  const raw = a.base + parts.reduce((s, p) => s + p[1], 0);
  const v = soft(raw);
  if (Math.abs(v - raw) >= 0.1) parts.push([v < raw ? '高位平滑' : '低位平滑', v - raw]);
  return { base: a.base, parts, v };
}
function cityRaw(c, t) {

  for (const a of c.attractions) { const w = (a.base / 100) * (a.base / 100); s += (spotRaw(a, t) - a.base) * w; ws += w; }

  for (const h of FC_HOURS) { const t = dayStart(day) + h * HOUR; s += kind === 'city' ? cityRaw(obj, t) - obj.base : spotRaw(obj, t) - obj.base; }

let snap = null, flashPrev = null;

const intervalMs = () => settings.interval * MIN;
function computeSnapshot(t) {
  sparkCache.clear();
  const sp = new Map(), ct = new Map();
  for (const a of spots) {
    const v = spotHeat(a, t);
    sp.set(a.id, { v, d1: v - spotHeat(a, t - HOUR), d24: v - spotHeat(a, t - DAY) });
  }
  let nat = 0, nat1 = 0;
  for (const c of cities) {
    const v = cityHeat(c, t), v1 = cityHeat(c, t - HOUR);
    ct.set(c.id, { v, d1: v - v1, d24: v - cityHeat(c, t - DAY) });
    nat += v; nat1 += v1;
  }
  cities.slice().sort((x, y) => ct.get(y.id).v - ct.get(x.id).v).forEach((c, i) => { ct.get(c.id).rank = i + 1; });
  spots.slice().sort((x, y) => sp.get(y.id).v - sp.get(x.id).v).forEach((a, i) => { sp.get(a.id).rank = i + 1; });
  const n = cities.length || 1;
  return { t, spots: sp, cities: ct, nat: nat / n, natD1: (nat - nat1) / n };
}

const CH = c => snap.cities.get(c.id).v;

  return sparkCache.get('nat');
}

let nextTick = 0, ticking = false;
function scheduleNext() { nextTick = (Math.floor(Date.now() / intervalMs()) + 1) * intervalMs(); }
async function tick(manual) {
  if (ticking) return;
  ticking = true;
  $('#hotpill').classList.add('busy');
  try {
    if (settings.feedUrl) await loadFeed();
    const now = Date.now();
    const prev = snap;
    snap = computeSnapshot(manual ? now : Math.floor(now / intervalMs()) * intervalMs());
    scheduleNext();
    flashPrev = prev;
    refreshLive();
    flashPrev = null;
    if (manual) toast(`热度已更新 · 北京时间 ${hhmm(snap.t)}`);

  const txt = ticking ? '正在更新' : `${mmss(left)} 后更新`;
  const pill = $('#hotpill .txt');
  if (pill) pill.textContent = `热度 ${txt}`;
  $('#hotpill').title = `热度每 ${settings.interval} 分钟更新一次，上次更新：北京时间 ${hhmm(snap.t)}。点击查看说明`;

/* ============================== 局部刷新（保持焦点，名次变化时做位移动画） ============================== */
function focusKey(container) {
  const el = document.activeElement;
  if (!el || !container.contains(el)) return null;
  const host = el.closest('[data-key]');
  return host ? { key: host.dataset.key, act: el.dataset.act || '' } : null;
}
function patchRegion(el, html, animate) {
  const fk = focusKey(el);
  const old = new Map();
  if (animate && !reduceMotion) for (const n of el.querySelectorAll('[data-key]')) old.set(n.dataset.key, n.getBoundingClientRect());
  el.innerHTML = html;
  if (fk) {
    const host = el.querySelector(`[data-key="${CSS.escape(fk.key)}"]`);
    const target = host && (fk.act ? host.querySelector(`[data-act="${CSS.escape(fk.act)}"]`) || (host.dataset.act === fk.act ? host : null) : host);
    if (target && target.focus) target.focus({ preventScroll: true });
  }
  if (old.size && typeof Element.prototype.animate === 'function') {
    for (const n of el.querySelectorAll('[data-key]')) {
      const r0 = old.get(n.dataset.key);
      if (!r0) continue;
      const r1 = n.getBoundingClientRect(), dx = r0.left - r1.left, dy = r0.top - r1.top;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) n.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 550, easing: 'cubic-bezier(.2,.7,.2,1)' });
    }
  }
}

/* ============================== 视图：热度说明与设置 ============================== */
function upcomingEvents(days) {
  const today = bjDate(snap.t).day, out = [];
  const seen = new Set();
  for (let k = 0; k <= days; k++) {
    const b = dayToBJ(today + k);
    const h = holidayByDay.get(today + k);
    if (h && !seen.has('h' + h.start)) { seen.add('h' + h.start); out.push({ s: Math.max(h.start, today), e: h.end, name: h.name + '假期' + (h.estimated ? '（预估）' : ''), scope: '全国', pts: h.level === 'golden' ? '+4.5 ~ +10' : '+3.5 ~ +6', now: h.start <= today }); }
    for (const ev of allEvents) {
      if (seen.has(ev) || !rangeHit(ev.start, ev.end, b)) continue;
      if (!spots.some(a => a._events.includes(ev))) { seen.add(ev); continue; }

function seriesFor(a, range) {

function chartSVG(series, range) {
  const W = 720, Ht = 200, L = 34, R = 46, T = 14, B = 26;
  const vs = series.map(p => p[1]);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const padv = Math.max(1, (hi - lo) * 0.15);
  lo = Math.max(0, lo - padv); hi = Math.min(100, hi + padv);
  if (hi - lo < 4) { const mid = (hi + lo) / 2; lo = Math.max(0, mid - 2); hi = Math.min(100, lo + 4); }
  const step = niceStep((hi - lo) / 4);
  const t0 = series[0][0], t1 = series[series.length - 1][0];
  const x = t => L + ((t - t0) / (t1 - t0 || 1)) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (Ht - T - B);
  let g = '';

  if (range !== '24h') {
    for (let d = bjDate(t0).day; d <= bjDate(t1).day; d++) {
      if (!holidayByDay.has(d)) continue;
      const xa = x(Math.max(t0, dayStart(d))), xb = x(Math.min(t1, dayStart(d + 1)));
      if (xb > xa) g += `<rect class="hol" x="${xa.toFixed(1)}" y="${T}" width="${(xb - xa).toFixed(1)}" height="${Ht - T - B}"/>`;
    }
  }
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
    const yy = y(v).toFixed(1);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="axis" x="${L - 6}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="end">${step < 1 ? v.toFixed(1) : Math.round(v)}</text>`;
  }
  // 时间刻度
  const ticks = [];
  if (range === '24h') { for (let tt = Math.ceil(t0 / (6 * HOUR)) * 6 * HOUR - BJ_OFF % (6 * HOUR); tt <= t1; tt += 6 * HOUR) if (tt >= t0) ticks.push([tt, `${pad(bjDate(tt).h)}:00`]); }
  else {
    const every = range === '7d' ? 1 : 5;
    for (let d = bjDate(t0).day; d <= bjDate(t1).day + 1; d++) {
      const tt = range === '7d' ? dayStart(d) : dayStart(d) + 14 * HOUR;
      if (tt < t0 || tt > t1 || (bjDate(t1).day - d) % every) continue;
      const b = bjDate(tt); ticks.push([tt, `${b.m}/${b.d}`]);
    }
  }
  for (const [tt, lab] of ticks) {
    const xx = x(tt);
    if (xx < L + 10 || xx > W - R - 6) continue;
    g += `<text class="axis" x="${xx.toFixed(1)}" y="${Ht - 8}" text-anchor="middle">${lab}</text>`;
  }
  const d = series.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join('');
  const last = series[series.length - 1];
  const base = (Ht - B).toFixed(1);
  return `<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="热度走势，当前 ${f1(last[1])}">${g}
    <path class="area" d="${d}L${x(last[0]).toFixed(1)} ${base}L${x(t0).toFixed(1)} ${base}Z"/><path class="line" d="${d}"/>
    <circle class="dot" cx="${x(last[0]).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="4"/><text class="endlab" x="${(x(last[0]) + 8).toFixed(1)}" y="${(y(last[1]) + 4).toFixed(1)}">${f1(last[1])}</text></svg>`;
}

  const close = () => { box.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; };
  const go = it => { close(); input.value = ''; input.blur(); if (it.kind === 'city') location.hash = '#city-' + it.o.id; else openSpot(it.o.id); };
  const draw = () => {
    const q = input.value;
    items = searchItems(q);
    if (!q.trim()) { close(); return; }
    box.innerHTML = items.length ? items.map((it, i) => it.kind === 'city'
      ? `<button type="button" role="option" data-i="${i}" class="${i === active ? 'active' : ''}"><span class="kind city">城市</span><span>${hl(it.o.name, q)}</span><span class="where">${esc(it.o.province)} · 热度 ${f1(CH(it.o))}</span></button>`
      : `<button type="button" role="option" data-i="${i}" class="${i === active ? 'active' : ''}"><span class="kind">景点</span><span>${hl(it.o.name, q)}</span><span class="where">${esc(it.o._c.name)} · 热度 ${f1(H(it.o))}</span></button>`).join('')
      : `<div class="none">没有找到“${esc(q.trim())}”。可以试试城市名，或景点名里的一两个字。</div>`;
    box.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  };
  input.addEventListener('input', () => { active = -1; draw(); });
  input.addEventListener('focus', () => { if (input.value.trim()) draw(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!items.length) return;
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      draw();
    } else if (e.key === 'Enter') {
      const it = items[active >= 0 ? active : 0];
      if (it) { e.preventDefault(); go(it); }
    } else if (e.key === 'Escape') { close(); }
  });
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) go(items[+b.dataset.i]); });
  input.addEventListener('blur', () => setTimeout(close, 120));
}

/* ============================== 路由 ============================== */
function parseRoute() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch (e) { /* 保留原值 */ }
  if (h.startsWith('city-')) return { name: 'city', id: h.slice(5) };
  if (h.startsWith('spot-')) { const a = spotById.get(h.slice(5)); if (a) return { name: 'city', id: a.city, spot: a.id }; }
  if (h === 'rank' || h === 'rank-city') return { name: 'rank', tab: h === 'rank-city' ? 'city' : 'spot' };
  if (h === 'fav' || h === 'about') return { name: h };
  return { name: 'home' };
}
const VIEWS = { home: viewHome, city: viewCity, rank: viewRank, fav: viewFav, about: viewAbout };
let lastRouteKey = '';
function route() {
  const r = parseRoute();
  if (dlg.open) { navClosing = true; dlg.close(); dlgState = null; }
  const key = r.name + ':' + (r.id || r.tab || '');
  view = VIEWS[r.name](r);
  viewEl.innerHTML = view.html;
  document.title = view.title;
  for (const a of $$('#nav a')) {
    const on = a.dataset.view === r.name || (r.name === 'city' && a.dataset.view === 'home');
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  if (key !== lastRouteKey) window.scrollTo(0, 0);
  lastRouteKey = key;
  if (view.after) view.after();
}

/* ============================== 交互 ============================== */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
function copyText(text, fallbackEl, okMsg) {
  const fallback = () => {
    if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); }
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    toast(ok ? okMsg : '浏览器不允许自动复制，内容已选中，请按 Ctrl+C 复制');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function toggleFav(list, id) {
  const a = fav[list], i = a.indexOf(id);
  if (i >= 0) a.splice(i, 1); else a.push(id);
  saveFav();
  syncFavButtons(id);
  const s = spotById.get(id);
  if (i < 0) toast(list === 'want' ? `已加入想去：${s.name}` : `已记录去过：${s.name}`);
  if (view && view.regions.favstats) { refreshRegion('favstats'); refreshRegion('favlists'); }
}
function importFav(text) {
  let j;
  try { j = JSON.parse(text); } catch (e) { toast('内容不是有效的备份格式（JSON）'); return; }
  const want = arr(j && j.want).filter(id => spotById.has(id));
  const been = arr(j && j.been).filter(id => spotById.has(id));
  if (!want.length && !been.length) { toast('备份里没有可识别的景点'); return; }
  let n = 0;
  for (const id of want) if (!fav.want.includes(id)) { fav.want.push(id); n++; }
  for (const id of been) if (!fav.been.includes(id)) { fav.been.push(id); n++; }
  saveFav();
  route();
  toast(`已导入 ${n} 条新收藏`);
}
let clearArmed = 0;
let weightRaf = 0;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, v = t.dataset.v, id = t.dataset.id;
  switch (act) {
    case 'spot': openSpot(id); break;
    case 'close': dlg.close(); break;
    case 'want': case 'been': toggleFav(act, id); break;
    case 'refresh': tick(true); break;
    case 'region':
      ui.region = v; saveUI();
      for (const b of $$('[data-act="region"]')) b.setAttribute('aria-pressed', b.dataset.v === v);
      refreshRegion('dgrid', true);
      break;
    case 'sort':
      ui.sort = v; saveUI();
      refreshRegion('toolbar'); refreshRegion('cards', true);
      break;
    case 'cat':
      ui.cat = v;
      refreshRegion('toolbar'); refreshRegion('cards', true);
      break;
    case 'flag': {
      const i = ui.flags.indexOf(v);
      if (i >= 0) ui.flags.splice(i, 1); else ui.flags.push(v);
      refreshRegion('toolbar'); refreshRegion('cards', true);
      break;
    }
    case 'wreset':
      settings.weights = Object.assign({}, DEFAULT_W); saveSettings();
      refreshRegion('toolbar'); refreshRegion('rankctl'); refreshRegion('cards', true); refreshRegion('picks'); refreshRegion('rlist', true);
      break;
    case 'rtab': location.hash = v === 'city' ? '#rank-city' : '#rank'; break;
    case 'rmetric': ui.rmetric = v; saveUI(); refreshRegion('rankctl'); refreshRegion('rlist', true); break;
    case 'rregion': ui.rregion = v; ui.rlimit = 30; refreshRegion('rankctl'); refreshRegion('rlist', true); refreshRegion('rmore'); break;
    case 'rcat': ui.rcat = v; ui.rlimit = 30; refreshRegion('rankctl'); refreshRegion('rlist', true); refreshRegion('rmore'); break;
    case 'rmore': ui.rlimit += 30; refreshRegion('rlist'); refreshRegion('rmore'); break;
    case 'range':
      if (!dlgState) break;
      dlgState.range = v;
      for (const b of $$('#dlg-body [data-act="range"]')) b.setAttribute('aria-pressed', b.dataset.v === v);
      $('#dlg-body [data-dregion="dchart"]').innerHTML = DETAIL_PARTS.dchart(spotById.get(dlgState.id));
      break;
    case 'copy-name': { const a = spotById.get(id); if (a) copyText(a.name, null, `已复制“${a.name}”，可以到美团、大众点评或飞猪 App 里搜索`); break; }
    case 'copy-json': { const ta = $('#fav-json'); copyText(ta.value, ta, '备份内容已复制'); break; }
    case 'import': importFav($('#fav-import').value); break;
    case 'clear':
      if (Date.now() - clearArmed > 4000) { clearArmed = Date.now(); t.textContent = '确认清空？再点一次'; setTimeout(() => { if (t.isConnected) t.textContent = '清空全部收藏'; }, 4000); break; }
      fav.want = []; fav.been = []; saveFav(); clearArmed = 0; route(); toast('收藏已清空');
      break;
    case 'feed-save': {
      const inp = $('#set-feed'); const url = inp.value.trim();
      if (url && !/^https?:\/\//i.test(url)) { toast('请输入以 http:// 或 https:// 开头的地址'); inp.focus(); break; }
      settings.feedUrl = url; saveSettings();
      feedState = { status: 'off', msg: url ? '正在读取…' : '未设置外部数据源，使用内置热度模型。' };
      refreshRegion('feedstatus');
      tick(true).then(() => refreshRegion('feedstatus'));
      break;
    }
    case 'feed-clear':
      settings.feedUrl = ''; saveSettings(); feedData = null; applyOverrides();
      feedState = { status: 'off', msg: '已停用外部数据源，使用内置热度模型。' };
      { const inp = $('#set-feed'); if (inp) inp.value = ''; }
      tick(true);
      break;
    case 'theme': cycleTheme(); break;
    case 'install': {
      const p = pwa.prompt;
      if (!p) { toast(installSteps()); break; }
      pwa.prompt = null;
      p.prompt();
      p.userChoice.then(r => { toast(r && r.outcome === 'accepted' ? '正在安装到手机桌面' : '已取消安装'); refreshRegion('install'); refreshRegion('installcard'); }).catch(() => {});
      break;
    }
    case 'copy-url': copyText(APP_URL, null, '手机版网址已复制，发到手机上用浏览器打开即可安装'); break;
    case 'install-dismiss': pwa.dismissed = true; store.set('yj.installDismissed', true); refreshRegion('install'); break;
    case 'locate': locate(t); break;
    default: break;
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.w;
  if (!k) return;
  settings.weights[k] = +e.target.value;
  saveSettings();
  for (const el of $$(`[data-wv="${k}"]`)) el.textContent = e.target.value;
  cancelAnimationFrame(weightRaf);
  weightRaf = requestAnimationFrame(() => { refreshRegion('cards', true); refreshRegion('picks'); refreshRegion('rlist', true); });
});
document.addEventListener('change', e => {
  if (e.target.id === 'set-interval') {
    settings.interval = +e.target.value; saveSettings();
    scheduleNext(); tick(false);
    toast(`热度改为每 ${settings.interval} 分钟更新`);
  } else if (e.target.id === 'fav-file') {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => importFav(String(rd.result || ''));
    rd.onerror = () => toast('文件读取失败');
    rd.readAsText(f);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '') && !dlg.open) {
    e.preventDefault(); $('#q-top').focus();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) secondTick(); });
$('#hotpill').addEventListener('click', () => { location.hash = '#about'; });

/* 主题：跟随系统 → 浅色 → 深色 */
const THEMES = { auto: ['auto', '跟随系统'], light: ['sun', '浅色'], dark: ['moon', '深色'] };
let theme = store.get('yj.theme', 'auto');
if (!THEMES[theme]) theme = 'auto';
function applyTheme() {
  const root = document.documentElement;
  if (theme === 'auto') { if (root.dataset.yjTheme) root.removeAttribute('data-theme'); root.removeAttribute('data-yj-theme'); }
  else { root.setAttribute('data-theme', theme); root.setAttribute('data-yj-theme', '1'); }
  const btn = $('#theme-btn');
  btn.innerHTML = icon(THEMES[theme][0]);
  btn.title = `主题：${THEMES[theme][1]}（点击切换）`;
}
function cycleTheme() {
  theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
  store.set('yj.theme', theme);
  applyTheme();
  toast(`主题：${THEMES[theme][1]}`);
}
$('#theme-btn').addEventListener('click', cycleTheme);

function footStats() {
  const el = $('#foot-stats');
  if (el) el.textContent = `${cities.length} 个目的地 · ${spots.length} 个景点 · 北京时间 ${hhmm(snap.t)} 更新`;
}

/* ============================== 手机应用（PWA）、离线提示与定位 ============================== */
const GEO = D.geo || {};
const UA = navigator.userAgent || '';
const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const inWeChat = /MicroMessenger/i.test(UA);
const topWindow = (() => { try { return window.top === window.self; } catch (e) { return false; } })();
const standalone = () => !!((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true);
// 只有发布到 https 网址、带应用清单的手机版才启用安装和离线缓存；本地文件版和嵌入式网页版不启用
const pwa = {
  enabled: !!document.querySelector('link[rel="manifest"]') && 'serviceWorker' in navigator && !!window.isSecureContext && /^https?:$/.test(location.protocol) && topWindow,
  prompt: null,
  dismissed: !!store.get('yj.installDismissed', false)
};
const canLocate = 'geolocation' in navigator && !!window.isSecureContext && topWindow && Object.keys(GEO).length > 0;
let me = null; // 本次打开期间的位置，只存在内存里，不保存、不上传

if (pwa.enabled) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* 注册失败时照常在线使用 */ });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pwa.prompt = e; refreshRegion('install'); refreshRegion('installcard'); });
  window.addEventListener('appinstalled', () => { pwa.prompt = null; toast('已安装到手机桌面'); refreshRegion('install'); refreshRegion('installcard'); });
}
function installSteps() {
  if (inWeChat) return '微信里不能安装：点右上角的“…”，选“在浏览器中打开”，再按提示安装。';
  if (isIOS) return '在 Safari 里点底部的分享按钮，再选“添加到主屏幕”。';
  return '在浏览器菜单里选“安装应用”或“添加到主屏幕”。';
}
function installBannerHTML() {
  if (!pwa.enabled || standalone() || pwa.dismissed) return '';
  return `<div class="installbar">${icon('download')}<div class="t"><b>装到手机桌面，出门随时看热度</b><span>${pwa.prompt ? '安装后像 App 一样打开，没有网络也能用。' : esc(installSteps()) + '装好后没有网络也能用。'}</span></div>
    <div class="acts">${pwa.prompt ? '<button type="button" class="btn sm primary" data-act="install">安装</button>' : ''}<button type="button" class="btn sm" data-act="install-dismiss">不再提示</button></div></div>`;
}
const APP_URL = 'https://browndli.github.io/Wander_China/';
function installCardHTML() {
  let state;
  if (standalone()) state = '<p class="status ok">现在正以应用方式运行。</p>';
  else if (pwa.enabled && pwa.prompt) state = `<div class="actions" style="margin-bottom:10px"><button type="button" class="btn primary" data-act="install">${icon('download')}安装到这台设备</button></div>`;
  else if (pwa.enabled) state = `<p>${esc(installSteps())}</p>`;
  else if (!topWindow) state = '<p>这是嵌在其他页面里的网页版，不能安装。请用手机打开发布到网址的手机版再安装。</p>';
  else state = '<p>这是本地文件版，不能直接安装。用手机打开下面的手机版网址就能安装。</p>';
  return state + `<p>手机版网址：<a href="${APP_URL}" target="_blank" rel="noopener noreferrer">${APP_URL}</a> <button type="button" class="linkbtn" data-act="copy-url">复制网址</button></p><ul>
    <li>iPhone：用 Safari 打开，点分享按钮，选“添加到主屏幕”。</li>
    <li>安卓：用 Chrome 或 Edge 打开，点“安装”，或在菜单里选“添加到主屏幕”。</li>
    <li>装好后没有网络也能打开，热度照常在手机上计算；地图、门票等外部平台链接需要联网。</li>
    <li>有网络时会自动获取最新版本，每周的热度更新也会同步过来。</li></ul>`;
}
function haversine(a, b) {
  const r = x => x * Math.PI / 180, dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLng / 2) ** 2;
  return 12742 * Math.asin(Math.min(1, Math.sqrt(s)));
}
const kmText = km => (km < 10 ? '不到 10 公里' : `约 ${Math.round(km)} 公里`);
const distTo = c => (me && GEO[c.id] ? haversine(me, GEO[c.id]) : null);
function nearestCities(n) {
  return me ? cities.filter(c => GEO[c.id]).map(c => ({ c, km: distTo(c) })).sort((x, y) => x.km - y.km).slice(0, n) : [];
}
function nearbyHTML() {
  if (!canLocate) return '';
  if (!me) return `<button type="button" class="chip locate" data-act="locate">${icon('pin')}<span>定位附近目的地</span></button><span class="muted">位置只在本机计算，不会上传</span>`;
  return `<span>离你最近：</span>${nearestCities(3).map((x, i) => `<a class="chip${i === 0 && x.km <= 180 ? ' here' : ''}" href="#city-${x.c.id}">${esc(x.c.name)}<span class="c">${kmText(x.km)}</span></a>`).join('')}<button type="button" class="linkbtn" data-act="locate">重新定位</button>`;
}
function locate(btn) {
  if (!canLocate) { toast('当前环境不能定位'); return; }
  if (btn) { btn.disabled = true; const s = btn.querySelector('span'); if (s) s.textContent = '定位中…'; }
  navigator.geolocation.getCurrentPosition(pos => {
    me = [pos.coords.latitude, pos.coords.longitude];
    refreshRegion('nearby');
    refreshRegion('citydist');
    const n = nearestCities(1)[0];
    if (n) toast(n.km <= 180 ? `你在${n.c.name}附近，点它看看哪里正热` : `离你最近的目的地是${n.c.name}，${kmText(n.km)}`);
  }, err => {
    refreshRegion('nearby');
    toast(err && err.code === 1 ? '没有定位权限，可以在手机设置里允许浏览器使用位置' : '暂时无法获取位置，请稍后再试');
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 10 * MIN });
}
function netState(announce) {
  const off = navigator.onLine === false;
  const el = $('#netstate');
  if (el) el.hidden = !off;
  if (announce) toast(off ? '已离线：热度照常在本机计算，外部平台链接需要联网' : '网络已恢复');
}
window.addEventListener('online', () => netState(true));
window.addEventListener('offline', () => netState(true));

/* ============================== 启动 ============================== */
applyOverrides();
snap = computeSnapshot(Math.floor(Date.now() / intervalMs()) * intervalMs());
scheduleNext();
applyTheme();
bindSearch($('#q-top'), $('#results-top'));
window.addEventListener('hashchange', route);
route();
footStats();
netState(false);
secondTick();
setInterval(secondTick, 1000);
if (settings.feedUrl) tick(false);

// 调试入口：在浏览器控制台可以用 YOUJI.heatAt('bj-gugong', '2026-10-01T14:00:00+08:00') 查看任意时刻的热度
window.YOUJI = {
  heatAt(id, when) { const a = spotById.get(id), t = when ? new Date(when).getTime() : Date.now(); return a ? +f1(spotHeat(a, t)) : null; },
  cityAt(id, when) { const c = cityById.get(id), t = when ? new Date(when).getTime() : Date.now(); return c ? +f1(cityHeat(c, t)) : null; },
  explain(id, when) { const a = spotById.get(id); return a ? spotDetail(a, when ? new Date(when).getTime() : Date.now()) : null; },
  refresh: () => tick(true),
  data: D
};
})();
