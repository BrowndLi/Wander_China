name: 构建安卓安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 放入离线备份页面
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www
          git fetch --depth=1 origin gh-pages
          git show FETCH_HEAD:index.html > app/src/main/assets/www/index.html
          ls -la app/src/main/assets/www

      - name: 生成本次构建的签名密钥
        shell: bash
        run: |
          pass=$(openssl rand -hex 16)
          echo "KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore app/release.keystore -alias wanderchina -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$pass" -keypass "$pass" -dname "CN=Wander China, O=BrowndLi, C=CN"

      - name: 构建
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          mkdir -p ci-out
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ci-out/build.log
          cp app/build/outputs/apk/release/app-release.apk WanderChina.apk
          ls -la WanderChina.apk | tee -a ci-out/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: WanderChina.apk

      - name: 保存构建日志
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/push-logs.sh ci-build ci-out

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: 启用 KVM 硬件加速
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模拟器里安装并运行
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh

      - name: 保存测试结果
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/push-logs.sh ci-test ci-out

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: 发布到 Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="1.0.${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'NOTES'
          游迹中国 Wander China 安卓安装包。

          安装：用安卓手机打开这个页面，下载 WanderChina.apk。第一次安装时，按提示允许浏览器“安装未知应用”。

          应用打开的是手机版网站 https://browndli.github.io/Wander_China/ 。有网络时自动获取最新热度，没有网络也能使用。

          每次构建使用新的签名。安装更新的版本前，需要先卸载旧版；卸载会清空收藏，可以先在「我的收藏」里导出备份。
          NOTES
          gh release create "android-v$ver" WanderChina.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "游迹中国 安卓版 $ver" --notes-file notes.md --latest
